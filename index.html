<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons & PWA Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- Android Chrome / PWA Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />

    <!-- Apple PWA Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#44612e" />
    <meta name="color-scheme" content="light" />

    <!-- iOS PWA / status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PrepUniv" />

    <!-- Windows / Edge tile -->
    <meta name="msapplication-TileColor" content="#44612e" />

    <!-- SEO -->
    <meta
      name="description"
      content="PrepUniv helps Nigerian university students ace CBT exams with course-specific practice quizzes, created and shared by fellow students and creators."
    />
    <meta name="author" content="PrepUniv" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.prepuniv.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PrepUniv" />
    <meta property="og:url" content="https://www.prepuniv.com/" />
    <meta
      property="og:title"
      content="PrepUniv — CBT & Exam Prep for Nigerian Students"
    />
    <meta
      property="og:description"
      content="PrepUniv helps Nigerian university students ace CBT exams with course-specific practice quizzes, created and shared by fellow students and creators."
    />
    <meta property="og:image" content="https://www.prepuniv.com/PrepUniv.png" />
    <meta
      property="og:image:alt"
      content="PrepUniv — University Learning Platform"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@PrepUnivijnv" />
    <meta
      name="twitter:title"
      content="PrepUniv — CBT & Exam Prep for Nigerian Students"
    />
    <meta
      name="twitter:description"
      content="PrepUniv helps Nigerian university students ace CBT exams with course-specific practice quizzes, created and shared by fellow students and creators."
    />
    <meta
      name="twitter:image"
      content="https://www.prepuniv.com/PrepUniv.png"
    />
    <meta
      name="twitter:image:alt"
      content="PrepUniv — University Learning Platform"
    />

    <!-- Structured Data (JSON-LD) — lets Google understand PrepUniv as an
         entity/organization, which is what makes things like a sitelinks
         search box or knowledge-panel eligibility possible. Doesn't render
         anything visible, purely for crawlers. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PrepUniv",
        "url": "https://www.prepuniv.com/",
        "logo": "https://www.prepuniv.com/PrepUniv.png",
        "description": "PrepUniv helps Nigerian university students ace CBT exams with course-specific practice quizzes, created and shared by fellow students and creators."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PrepUniv",
        "url": "https://www.prepuniv.com/"
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Page Title -->
    <title>PrepUniv — CBT & Exam Prep for Nigerian Students</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
