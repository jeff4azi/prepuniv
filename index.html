<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons & PWA Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- Android Chrome / PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />

    <!-- Apple PWA Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#44612e" />
    <meta name="color-scheme" content="light" />

    <!-- iOS PWA / status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PrepUniv" />

    <!-- Windows / Edge tile -->
    <meta name="msapplication-TileColor" content="#44612e" />

    <!-- Keep the browser/standalone status-bar theme color in sync with the
         real --color-primary CSS variable.  If you ever tweak the palette
         in src/index.css, the top bar automatically matches on next load
         (no need to remember to re-edit this file + the PWA manifest). -->
    <script>
      (function syncThemeColorFromCss() {
        try {
          var style = getComputedStyle(document.documentElement);
          var primary = style.getPropertyValue('--color-primary').trim();
          if (!primary) return;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', primary);
        } catch (_) {}
      })();
    </script>

    <!-- SEO -->
    <meta
      name="description"
      content="PrepUniv is a university learning platform for practicing course-specific questions, preparing for CBT exams, and creating and sharing academic content."
    />
    <meta
      name="keywords"
      content="PrepUniv, university quizzes, CBT practice, university exams, exam preparation, past questions, student learning, academic content"
    />
    <meta name="author" content="PrepUniv" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.prepuniv.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PrepUniv" />
    <meta property="og:url" content="https://www.prepuniv.com/" />
    <meta
      property="og:title"
      content="PrepUniv — Prepare Smarter for University"
    />
    <meta
      property="og:description"
      content="Practice university course questions, prepare for CBT exams, and create and share academic content with PrepUniv."
    />
    <meta
      property="og:image"
      content="https://www.prepuniv.com/PrepUniv.png"
    />
    <meta
      property="og:image:alt"
      content="PrepUniv — University Learning Platform"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="PrepUniv — Prepare Smarter for University"
    />
    <meta
      name="twitter:description"
      content="Practice university course questions, prepare for CBT exams, and create and share academic content with PrepUniv."
    />
    <meta
      name="twitter:image"
      content="https://www.prepuniv.com/PrepUniv.png"
    />
    <meta
      name="twitter:image:alt"
      content="PrepUniv — University Learning Platform"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Page Title -->
    <title>PrepUniv — Prepare Smarter for University</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
